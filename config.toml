# Base URL used when generating links to your pages
# For GitHub Pages project site, include the repository path and trailing slash
baseURL = "https://zavarov.com/"

# Basic metadata configuration for your blog.
title = "Константин Заваров"
author = "Konstantin Zavarov"
copyright = "Copyright © 2026, Konstantin Zavarov."
defaultContentLanguage = "ru"
defaultContentLanguageInSubdirectory = false

# Generate a nice robots.txt for SEO
enableRobotsTXT = true

# Generate "Bearblog"-like URLs !only!, see https://bearblog.dev/.
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

# Custom output format for llms.txt
[mediaTypes."text/plain"]
  suffixes = ["txt"]

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

# Output formats: add JSON feed and llms.txt for AI crawlers
[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]

[permalinks]
  blog = "/:slug/"
  categories = "/blog/:slug"

[languages]
  [languages.ru]
    weight = 1
    languageCode = "ru"
    languageName = "RU"
    title = "Константин Заваров"
    contentDir = "content/ru"
  [languages.en]
    weight = 2
    languageCode = "en"
    languageName = "EN"
    title = "Konstantin Zavarov"
    contentDir = "content/en"

[params]
  # The "description" of your website. This is used in the meta data of your generated html.
  description = "Личный блог Константина Заварова"

  # The path to your "favicon". This should be a square (at least 32px x 32px) png-file.
  # Hint: It's good practise to also put a "favicon.ico"-file into your "static"-folder.
  favicon = "images/favicon.png"

  # Another "title" :-). This one is used as the site_name on the Hugo's internal
  # opengraph structured data template.
  # See https://ogp.me/ and https://gohugo.io/templates/internal#open-graph.
  title = "Константин Заваров"

  # SEO improvements
  authorName = "Константин Заваров"
  authorURL = "https://zavarov.com/"
  telegramChannel = "pmgen"

  # This theme will, by default, inject a made-with-line at the bottom of the page.
  # You can turn it off, but we would really appreciate if you don't :-).
  # hideMadeWithLine = true

  # By default, if you want to read more than one blog post you have to always go
  # back to the /blog page.
  # By enabling this feature each blog post will have at the end a navigator
  # enablePostNavigator = true

  # By default, this theme displays dates with a format like "02 Jan, 2006", but
  # you can customize it by setting the `dateFormat` param in your site's config
  # file. See [Hugo's Format function docs](https://gohugo.io/functions/format/)
  # for details. An example TOML config that uses [ISO
  # 8601](https://en.wikipedia.org/wiki/ISO_8601) format:
  # dateFormat = "2006-01-02"

# Configure markup highlighter to match "Bearblog" aesthetics, see
# https://gohugo.io/configuration/markup/#highlight
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        leftDoubleQuote = "&laquo;"
        rightDoubleQuote = "&raquo;"
      [markup.goldmark.extensions.math]
        enable = true
  [markup.highlight]
    style = 'friendly'
    lineNos = true
    lineNumbersInTable = false
    codeFences = true

[languages.ru.menu]
  [[languages.ru.menu.main]]
    identifier = "blog"
    name       = "Статьи"
    url        = "/blog/"
    weight     = 1

  [[languages.ru.menu.main]]
    identifier = "consultation"
    name       = "Консультация"
    url        = "/consultation/"
    weight     = 2

  [[languages.ru.menu.main]]
    identifier = "telegram"
    name       = "Канал в Telegram"
    url        = "https://t.me/pmgen"
    weight     = 3

[languages.en.menu]
  [[languages.en.menu.main]]
    identifier = "blog"
    name       = "Articles"
    url        = "/en/blog/"
    weight     = 1

  [[languages.en.menu.main]]
    identifier = "consultation"
    name       = "Consultation"
    url        = "/en/consultation/"
    weight     = 2

  [[languages.en.menu.main]]
    identifier = "telegram"
    name       = "Telegram Channel"
    url        = "https://t.me/pmgen"
    weight     = 3
