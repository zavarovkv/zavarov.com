# Base URL used when generating links to your pages
# For GitHub Pages project site, include the repository path and trailing slash
baseURL = "https://zavarov.com/"

# Basic metadata configuration for your blog.
title = "Константин Заваров"
author = "Konstantin Zavarov"
copyright = "Copyright © 2026, Konstantin Zavarov."
theme = "hugo-mini"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdirectory = false

# Generate a nice robots.txt for SEO
enableRobotsTXT = true

# Generate "Bearblog"-like URLs !only!, see https://bearblog.dev/.
# "term" included too: without it Hugo still builds per-category pages
# (each a duplicate of the full blog listing, since the theme's list.html
# always renders the whole /blog section).
disableKinds = ["taxonomy", "term"]
ignoreErrors = ["error-disable-taxonomy"]

# Custom output format for llms.txt
[mediaTypes."text/plain"]
  suffixes = ["txt"]

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

# Output formats: add JSON feed and llms.txt for AI crawlers
[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]

[permalinks]
  blog = "/:slug/"

[languages]
  [languages.ru]
    weight = 1
    languageCode = "ru"
    languageName = "RU"
    title = "Константин Заваров"
    contentDir = "content/ru"
    [languages.ru.params]
      description = "Личный блог Константина Заварова"
      title = "Константин Заваров"
      authorName = "Константин Заваров"
      # Free-text bio for /llms.txt (theme's home.llms.txt output)
      [languages.ru.params.llms]
        about = "Константин Заваров — Head of Product в Ozon с 12+ годами опыта в IT. Ранее работал в Яндексе, Мегамаркете и Лаборатории Касперского. С 2021 по 2025 год вел курсы в Яндекс Практикуме. Ведет Telegram-канал «Код Продакта» (https://t.me/pmgen). Контент на русском языке."
    # Per-language markup REPLACES the root [markup] section (Hugo does not
    # deep-merge it), so this block must mirror [markup] below in full. The
    # only intended difference: Russian typographic quotes («») — EN keeps
    # Goldmark's default English smart quotes.
    [languages.ru.markup]
      [languages.ru.markup.goldmark]
        [languages.ru.markup.goldmark.renderer]
          unsafe = true
        [languages.ru.markup.goldmark.extensions]
          [languages.ru.markup.goldmark.extensions.typographer]
            leftDoubleQuote = "&laquo;"
            rightDoubleQuote = "&raquo;"
          [languages.ru.markup.goldmark.extensions.math]
            enable = true
      [languages.ru.markup.highlight]
        style = 'friendly'
        lineNos = true
        lineNumbersInTable = false
        codeFences = true
  [languages.en]
    weight = 2
    languageCode = "en"
    languageName = "EN"
    title = "Konstantin Zavarov"
    contentDir = "content/en"
    [languages.en.params]
      description = "Konstantin Zavarov's blog about product management"
      title = "Konstantin Zavarov"
      authorName = "Konstantin Zavarov"
      # Free-text bio for /en/llms.txt (theme's home.llms.txt output)
      [languages.en.params.llms]
        about = "Konstantin Zavarov is Head of Product at Ozon with 12+ years of experience in IT. Previously worked at Yandex, Megamarket, and Kaspersky Lab. Taught product management courses at Yandex Practicum from 2021 to 2025. Runs the «Код Продакта» Telegram channel (https://t.me/pmgen). Original content is in Russian; English pages are AI-translated."

