  # Social links (used in footer and structured data)
  [params.social]
    telegram = "https://t.me/zavarov"
    linkedin = "https://www.linkedin.com/in/zavarovkv/"
    github = "https://github.com/zavarovkv/"
    email = "zavarovkv@gmail.com"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Required for HTML in markdown (shortcodes, styled blocks).
      # Safe because all content is author-controlled. Disable if opening to guest posts.
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        leftDoubleQuote = "&laquo;"
        rightDoubleQuote = "&raquo;"
      [markup.goldmark.extensions.math]
        enable = true
  [markup.highlight]
    style = 'friendly'
    lineNos = true
    lineNumbersInTable = false
    codeFences = true

