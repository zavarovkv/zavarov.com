name: GitHub Pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
          submodules: true  # Checkout hugo-mini theme

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.145.0'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Anti-loop guard: translation produces an auto-commit by the bot.
      # Skip retranslation when we're processing that bot commit, and on PRs
      # (which should never mutate the default branch or spend API tokens).
      - name: Translate content
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && github.event.head_commit.author.email != 'github-actions[bot]@users.noreply.github.com'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run translate

      - name: Commit translations
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && github.event.head_commit.author.email != 'github-actions[bot]@users.noreply.github.com'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/en/
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
          else
            git commit -m "Auto-translate EN content [skip ci]"
            git push
          fi

      - name: Fetch Telegram reactions
        continue-on-error: true
        run: npm run fetch-telegram-reactions

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

