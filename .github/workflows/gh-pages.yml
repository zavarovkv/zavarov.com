name: GitHub Pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo-version: ['0.154.5', 'latest']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Regression tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build
        run: hugo --minify --panicOnWarning

      - name: Check content and local links
        run: npm run check

      - name: Check self-hosted assets
        run: test -s public/js/mermaid/mermaid.esm.min.mjs

      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser regression tests
        run: npm run test:browser

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
          submodules: true  # Checkout hugo-mini theme

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          # Site minimum; PRs also check the current release. The theme keeps
          # its independent 0.146.0 compatibility matrix in its own CI.
          hugo-version: '0.154.5'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Regression tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      # Anti-loop guard: translation produces an auto-commit by the bot.
      # Skip retranslation when we're processing that bot commit, and on PRs
      # (which should never mutate the default branch or spend API tokens).
      - name: Translate content
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && github.event.head_commit.author.email != 'github-actions[bot]@users.noreply.github.com'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # API outages preserve the previous EN batch and emit a warning. Local
        # content, build, and link errors still fail their normal checks.
        run: npm run translate -- --allow-stale

      - name: Fetch Telegram reactions
        continue-on-error: true
        run: npm run fetch-telegram-reactions

      # Private font bytes are available only in the trusted main deployment job.
      # Fork/PR validation uses the theme's default open-source fonts.
      - name: Restore licensed site fonts
        if: vars.BLOG_FONT == 'als-story'
        env:
          ALS_STORY_PART_1: ${{ secrets.ALS_STORY_PART_1 }}
          ALS_STORY_PART_2: ${{ secrets.ALS_STORY_PART_2 }}
          ALS_STORY_PART_3: ${{ secrets.ALS_STORY_PART_3 }}
          ALS_STORY_PART_4: ${{ secrets.ALS_STORY_PART_4 }}
        run: node scripts/prepare-site-fonts.mjs --restore

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_FONT: ${{ vars.BLOG_FONT }}
        run: |
          if [ "$BLOG_FONT" = "als-story" ]; then
            npm run build -- --config config.toml,config/fonts/als-story.toml
          else
            npm run build
          fi

      - name: Check content and local links
        run: npm run check

      - name: Check self-hosted assets
        # Mermaid is vendored out of node_modules by the postinstall hook
        # (scripts/vendor-mermaid.mjs) and served from our own domain via
        # params.mermaidModuleSrc. If the hook is skipped — e.g. an --omit=dev
        # install — pages with mermaid = true would deploy without their
        # diagram script and fail silently in the browser, so fail here.
        run: |
          set -euo pipefail
          test -s public/js/mermaid/mermaid.esm.min.mjs
          echo "ok: public/js/mermaid/mermaid.esm.min.mjs ($(wc -c < public/js/mermaid/mermaid.esm.min.mjs) bytes)"

      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser regression tests
        env:
          BLOG_FONT: ${{ vars.BLOG_FONT }}
        run: |
          if [ "$BLOG_FONT" = "als-story" ]; then
            BROWSER_HUGO_CONFIG=config.toml,config/fonts/als-story.toml npm run test:browser
          else
            npm run test:browser
          fi

      - name: Commit generated updates
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && github.event.head_commit.author.email != 'github-actions[bot]@users.noreply.github.com'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/en/ data/github_stars.json
          if git diff --cached --quiet; then
            echo "No translation or public counter changes to commit."
          else
            git commit -m "Auto-update EN translations and public counters [skip ci]"
            git push
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
