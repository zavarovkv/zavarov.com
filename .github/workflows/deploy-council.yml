name: Deploy Council landing

on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful main-branch GitHub Pages workflow run ID containing Council artifact"
        required: true
        type: string
      artifact_name:
        description: "Exact council-landing-<sha>-deploy artifact name"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: council-landing-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: council-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release inputs
        env:
          RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT: ${{ inputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$ARTIFACT" =~ ^council-landing-[a-f0-9]{40}-deploy$ ]] || exit 1
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID" > run.json
          printf '{"jobs":[]}' > jobs.json
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" > jobs.json
          fi
          node scripts/validate-council-release.mjs run.json jobs.json
      - name: Download reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir release
          test -s release/council-landing.tar.gz
          tar -tzf release/council-landing.tar.gz > release/manifest.txt
          grep -Fx 'index.html' release/manifest.txt
          grep -Fx 'en/index.html' release/manifest.txt
          grep -Fx 'council/avatars/qui-gon.png' release/manifest.txt
          sha256sum release/council-landing.tar.gz | tee release/sha256.txt
      - name: Install restricted SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.COUNCIL_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.COUNCIL_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Deploy via fixed server-side command
        env:
          COUNCIL_HOST: ${{ vars.COUNCIL_DEPLOY_HOST }}
          COUNCIL_USER: ${{ vars.COUNCIL_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$COUNCIL_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] && [[ "$COUNCIL_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          digest=$(cut -d' ' -f1 release/sha256.txt)
          # Restricted SSH authorized_keys forced-command should accept only this operation.
          # No root password, no agent forwarding, no remote arbitrary shell.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ForwardAgent=no \
            -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i ~/.ssh/id_ed25519 "$COUNCIL_USER@$COUNCIL_HOST" "council-landing-deploy $digest" \
            < release/council-landing.tar.gz
      - name: Remove temporary deployment identity
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
