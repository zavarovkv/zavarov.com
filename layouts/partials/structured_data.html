{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify }},
  "description": {{ with .Description }}{{ . | jsonify }}{{ else }}{{ .Summary | jsonify }}{{ end }},
  "author": {
    "@type": "Person",
    "name": {{ (.Site.Params.authorName | default .Site.Params.author) | jsonify }}
    {{ if .Site.Params.authorURL }},
    "url": {{ .Site.Params.authorURL | jsonify }}
    {{ end }}
  },
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "publisher": {
    "@type": "Person",
    "name": {{ (.Site.Params.authorName | default .Site.Params.author) | jsonify }}
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify }}
  }
  {{ if .Params.tags }},
  "keywords": {{ (delimit .Params.tags ", ") | jsonify }}
  {{ end }}
  ,
  "image": {
    "@type": "ImageObject",
    "url": {{ (printf "%sog.png" .Permalink) | jsonify }},
    "width": 1200,
    "height": 630
  }
}
</script>
{{ else }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ .Site.Title | jsonify }},
  "url": {{ .Site.BaseURL | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ (.Site.Params.authorName | default .Site.Params.author) | jsonify }}
    {{ if .Site.Params.authorURL }},
    "url": {{ .Site.Params.authorURL | jsonify }}
    {{ end }}
  }
  {{ if .Site.Params.description }},
  "description": {{ .Site.Params.description | jsonify }}
  {{ end }}
}
</script>
{{ end }}
