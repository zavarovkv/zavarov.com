<script>
  // Add likely-light class for dark theme
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.querySelectorAll('.likely').forEach(function(el) {
      el.classList.add('likely-light');
    });
  }

  // Initialize Likely social sharing buttons
  if (typeof likely !== 'undefined') {
    likely.initiate();
  }

  // Fix active navigation link highlighting
  (function() {
    function highlightActiveNav() {
      var currentPath = window.location.pathname;
      var navLinks = document.querySelectorAll('nav a');
      
      if (navLinks.length === 0) {
        return; // Navigation not loaded yet
      }
      
      // Remove any existing link-selected classes first
      navLinks.forEach(function(link) {
        link.classList.remove('link-selected');
      });
      
      // Helper function to normalize path (remove /zavarov.com prefix and trailing slashes)
      function normalizePath(path) {
        if (!path) return '/';
        var normalized = path.replace(/^\/zavarov\.com/, '') || '/';
        normalized = normalized.replace(/\/$/, '') || '/';
        return normalized;
      }
      
      var currentPathNormalized = normalizePath(currentPath);
      
      // Check if we're on home page and highlight title
      var titleLink = document.querySelector('.title');
      var headerContainer = document.querySelector('.header-container');
      if (titleLink) {
        if (currentPathNormalized === '/' || currentPathNormalized === '') {
          titleLink.classList.add('title-selected');
          // Hide avatar on home page
          if (headerContainer) {
            headerContainer.classList.add('home-page');
          }
        } else {
          titleLink.classList.remove('title-selected');
          if (headerContainer) {
            headerContainer.classList.remove('home-page');
          }
        }
      }
      
      navLinks.forEach(function(link) {
        var href = link.getAttribute('href');
        if (!href || href.startsWith('http://') || href.startsWith('https://')) {
          return;
        }
        
        // Normalize link path (also remove /zavarov.com if present)
        var linkPathNormalized = normalizePath(href);
        
        // Special case for home page
        if (linkPathNormalized === '/' || linkPathNormalized === '') {
          // Check if we're at root
          if (currentPathNormalized === '/' || currentPathNormalized === '') {
            link.classList.add('link-selected');
          }
        } else {
          // For other pages, check if current path matches or starts with link path
          if (currentPathNormalized === linkPathNormalized || 
              currentPathNormalized.startsWith(linkPathNormalized + '/')) {
            link.classList.add('link-selected');
          }
        }
      });
    }
    
    // Run on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', highlightActiveNav);
    } else {
      highlightActiveNav();
    }
  })();

  // Mobile menu toggle
  (function() {
    function initMobileMenu() {
      var toggle = document.querySelector('.mobile-menu-toggle');
      var nav = document.querySelector('.main-nav');
      
      if (!toggle || !nav) {
        return;
      }
      
      var overlay = document.querySelector('.mobile-menu-overlay');
      
      function closeMenu() {
        nav.classList.remove('active');
        toggle.classList.remove('active');
        if (overlay) overlay.classList.remove('active');
      }
      
      function openMenu() {
        nav.classList.add('active');
        toggle.classList.add('active');
        if (overlay) overlay.classList.add('active');
      }
      
      toggle.addEventListener('click', function() {
        if (nav.classList.contains('active')) {
          closeMenu();
        } else {
          openMenu();
        }
      });
      
      // Close menu when clicking on overlay
      if (overlay) {
        overlay.addEventListener('click', closeMenu);
      }
      
      // Close menu when clicking on a link
      var navLinks = nav.querySelectorAll('a');
      navLinks.forEach(function(link) {
        link.addEventListener('click', closeMenu);
      });
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMobileMenu);
    } else {
      initMobileMenu();
    }
  })();
</script>
