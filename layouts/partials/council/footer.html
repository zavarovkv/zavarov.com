{{- $ru := eq .Language.Lang "ru" -}}
<footer class="foot footer-bar" aria-label="{{ if $ru }}Подвал сайта{{ else }}Site footer{{ end }}">
  <div class="footer-links">
    <a href="https://github.com/zavarovkv/agent-council" target="_blank" rel="noopener noreferrer" aria-label="Agent Council GitHub">GitHub</a>
    <a href="https://zavarov.com/" target="_blank" rel="noopener noreferrer">{{ if $ru }}Блог{{ else }}Blog{{ end }}</a>
  </div>
  <div class="footer-controls">
    <a class="lang-toggle" href="{{ if $ru }}/en/{{ else }}/{{ end }}" aria-label="{{ if $ru }}English{{ else }}Русский{{ end }}"><span class="lang-label">RU</span><span aria-hidden="true">/</span><span class="lang-label">EN</span></a>
    <button type="button" class="theme-toggle" aria-label="{{ if $ru }}Переключить тему{{ else }}Toggle theme{{ end }}" title="{{ if $ru }}Переключить тему{{ else }}Toggle theme{{ end }}">
      <svg class="theme-icon-light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      <svg class="theme-icon-dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
  <div class="footer-copy">© {{ now.Format "2006" }} Agent Council</div>
</footer>
